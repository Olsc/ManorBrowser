<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>网络连接已断开</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        }

        :root {
            --bg-1: #fbe9f4;
            --bg-2: #f3d9ef;
            --bg-3: #fceef7;
            --text: #8a1f6e;
            --text-soft: #a86a9a;
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.75);
            --glass-shadow: 0 12px 40px rgba(214, 51, 132, 0.18);
            --accent: #e0428f;
            --accent-deep: #c2185b;
            --btn-text: #ffffff;
            --orb-1: rgba(240, 98, 146, 0.4);
            --orb-2: rgba(216, 130, 200, 0.35);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-1: #2a1222;
                --bg-2: #331527;
                --bg-3: #1d0d18;
                --text: #ffd9ec;
                --text-soft: #d9a8c4;
                --glass-bg: rgba(74, 32, 60, 0.45);
                --glass-border: rgba(224, 66, 143, 0.35);
                --glass-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
                --accent: #f06292;
                --accent-deep: #e0428f;
                --orb-1: rgba(224, 66, 143, 0.35);
                --orb-2: rgba(150, 50, 110, 0.3);
            }
        }

        body {
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
            background-size: 400% 400%;
            animation: flow 14s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px 32px;
            width: 88%;
            max-width: 420px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow: var(--glass-shadow);
            animation: fadeIn 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .icon {
            width: 84px;
            height: 84px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-deep));
            box-shadow: 0 10px 24px rgba(224, 66, 143, 0.35);
        }

        .icon svg {
            width: 44px;
            height: 44px;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        p {
            font-size: 0.95rem;
            margin-bottom: 28px;
            opacity: 0.8;
            color: var(--text-soft);
            line-height: 1.7;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            padding: 13px 26px;
            border-radius: 24px;
            font-size: 0.92rem;
            font-weight: 500;
            transition: all 0.25s ease;
            display: inline-block;
            border: 1px solid transparent;
            cursor: pointer;
            flex: 1;
            min-width: 130px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-deep));
            color: var(--btn-text);
            box-shadow: 0 6px 18px rgba(224, 66, 143, 0.35);
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent-deep);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(8px);
        }

        @media (prefers-color-scheme: dark) {
            .btn-secondary {
                color: var(--accent);
            }
        }

        .btn:hover,
        .btn:active {
            transform: translateY(-2px) scale(1.02);
            filter: brightness(1.08);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="content">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M17 8.5A6.5 6.5 0 0 0 4.5 10.5 4.5 4.5 0 0 0 5 19.5h11a5 5 0 0 0 1-9.9" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="rgba(255,255,255,0.2)" />
                <path d="M12 12l-3 3.5m3-3.5l3 3.5M12 12v6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </div>
        <h1 id="title">哎呀，网络开小差了</h1>
        <p id="msg">检查一下你的 Wi-Fi 或数据连接，稍后再试吧。</p>
        <div class="btn-group">
            <a href="javascript:location.reload()" class="btn btn-primary" id="btn-retry">刷新重试</a>
            <a href="404_game.html" class="btn btn-secondary" id="btn-game" target="_blank">玩个小游戏</a>
        </div>
    </div>
    <script>
        const i18n = {
            zh: {
                title: "哎呀，网络开小差了",
                msg: "检查一下你的 Wi-Fi 或数据连接，稍后再试吧。",
                btnRetry: "刷新重试",
                btnGame: "玩个小游戏",
                pageTitle: "网络连接已断开"
            },
            en: {
                title: "Oh no, you're offline",
                msg: "Check your Wi-Fi or data connection and try again.",
                btnRetry: "Retry",
                btnGame: "Play a game",
                pageTitle: "No Internet Connection"
            }
        };

        const lang = (navigator.language || navigator.userLanguage).startsWith('zh') ? 'zh' : 'en';
        document.title = i18n[lang].pageTitle;
        document.getElementById('title').innerText = i18n[lang].title;
        document.getElementById('msg').innerText = i18n[lang].msg;
        document.getElementById('btn-retry').innerText = i18n[lang].btnRetry;
        document.getElementById('btn-game').innerText = i18n[lang].btnGame;
    </script>
</body>

</html>
