<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>出错了，但这不是你的错</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        }

        :root {
            --bg-1: #e9e4fb;
            --bg-2: #d6ccf7;
            --bg-3: #efeafc;
            --text: #3f2a7d;
            --text-soft: #6a5a9e;
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.75);
            --glass-shadow: 0 12px 40px rgba(98, 0, 238, 0.18);
            --accent: #7c4dff;
            --accent-deep: #6200ee;
            --btn-text: #ffffff;
            --orb-1: rgba(167, 139, 250, 0.45);
            --orb-2: rgba(208, 188, 255, 0.4);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-1: #1a1530;
                --bg-2: #221a3d;
                --bg-3: #141021;
                --text: #e6deff;
                --text-soft: #a89ed6;
                --glass-bg: rgba(58, 46, 102, 0.45);
                --glass-border: rgba(167, 139, 250, 0.35);
                --glass-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
                --accent: #9d7bff;
                --accent-deep: #7c4dff;
                --orb-1: rgba(124, 77, 255, 0.35);
                --orb-2: rgba(88, 60, 180, 0.3);
            }
        }

        body {
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
            background-size: 400% 400%;
            animation: flowAnimation 18s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes flowAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 1;
            animation: float 22s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .orb-1 {
            width: 320px;
            height: 320px;
            top: -120px;
            left: -120px;
            background: var(--orb-1);
        }

        .orb-2 {
            width: 420px;
            height: 420px;
            bottom: -160px;
            right: -120px;
            background: var(--orb-2);
            animation-delay: -6s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 90px) scale(1.12); }
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px 32px;
            width: 88%;
            max-width: 420px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow: var(--glass-shadow);
            animation: fadeIn 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .icon {
            width: 84px;
            height: 84px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-deep));
            box-shadow: 0 10px 24px rgba(124, 77, 255, 0.35);
        }

        .icon svg {
            width: 44px;
            height: 44px;
        }

        .code {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: 4px;
            line-height: 1;
            margin-bottom: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent-deep));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 1px;
            color: var(--text);
        }

        p {
            font-size: 0.95rem;
            margin-bottom: 28px;
            opacity: 0.8;
            color: var(--text-soft);
            line-height: 1.7;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            padding: 13px 26px;
            border-radius: 24px;
            font-size: 0.92rem;
            font-weight: 500;
            transition: all 0.25s ease;
            display: inline-block;
            border: 1px solid transparent;
            cursor: pointer;
            flex: 1;
            min-width: 130px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-deep));
            color: var(--btn-text);
            box-shadow: 0 6px 18px rgba(124, 77, 255, 0.35);
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent-deep);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(8px);
        }

        @media (prefers-color-scheme: dark) {
            .btn-secondary {
                color: var(--accent);
            }
        }

        .btn:hover,
        .btn:active {
            transform: translateY(-2px) scale(1.02);
            filter: brightness(1.08);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="content">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 19.5h20L12 2z" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" fill="rgba(255,255,255,0.25)" />
                <path d="M12 9v5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
                <circle cx="12" cy="17" r="1.3" fill="#FFFFFF" />
            </svg>
        </div>
        <div class="code">404</div>
        <h1 id="error-title">遇到了些问题，但这不是你的错</h1>
        <p id="error-msg">或许这个页面正在云端漫步，先请稍微休息一下。</p>
        <div class="btn-group">
            <a href="javascript:history.back()" class="btn btn-secondary" id="btn-back">返回上一页</a>
            <a href="404_game.html" class="btn btn-primary" id="btn-game" target="_blank">玩个小游戏</a>
        </div>
    </div>
    <script>
        const i18n = {
            zh: {
                title: "出错了，但这不是你的错",
                errorTitle: "遇到了些问题，但这不是你的错",
                errorMsg: "或许这个页面正在云端漫步，先请稍微休息一下。",
                btnBack: "返回上一页",
                btnGame: "玩个小游戏"
            },
            en: {
                title: "Error, But Not Your Fault",
                errorTitle: "Something went wrong, but it's not you",
                errorMsg: "Maybe this page is taking a walk in the clouds, take a little break.",
                btnBack: "Go Back",
                btnGame: "Play a Game"
            }
        };

        const lang = (navigator.language || navigator.userLanguage).startsWith('zh') ? 'zh' : 'en';
        document.title = i18n[lang].title;
        document.getElementById('error-title').innerText = i18n[lang].errorTitle;
        document.getElementById('error-msg').innerText = i18n[lang].errorMsg;
        document.getElementById('btn-back').innerText = i18n[lang].btnBack;
        document.getElementById('btn-game').innerText = i18n[lang].btnGame;
    </script>
</body>

</html>
